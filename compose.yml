name: vortex-farma-app
services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: vortex_farma
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex -d vortex_farma"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7.4.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.2.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vortex
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD em .env}
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 15
    restart: unless-stopped
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["--migrate"]
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=vortex_farma;Username=vortex;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Database=vortex_farma;Username=vortex;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      KeysPath: /keys
      ProxyNetwork: 172.29.75.0/24
    volumes: ["keys-data:/keys"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: {PROJECT: VortexFarma.Worker}
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Database=vortex_farma;Username=vortex;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: vortex
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SWAGGER_URL: ${NEXT_PUBLIC_SWAGGER_URL:-}
    depends_on: [api]
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${GATEWAY_PORT:-8088}:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
    restart: unless-stopped
networks:
  default:
    ipam:
      config: [{subnet: 172.29.75.0/24}]
volumes:
  postgres-data:
  redis-data:
  rabbit-data:
  keys-data:
